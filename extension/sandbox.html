      body {
        font-family: system-ui, sans-serif;
        margin: 3rem auto;

      code {

  <body>
    <h1>Nimvarya sandbox tab</h1>
    <p>
      This tab belongs to the Nimvarya bridge extension. Connected AI sessions
      navigate it with <code>navigateTo</code> and drive the page here.
    </p>
    <p>
      You can close it at any time. The bridge will not reopen it on its own;
      the next <code>navigateTo</code> call opens a fresh one.
    </p>
